<div class="auth-page">
  <div class="auth-card">
    <a routerLink="/" class="back-link">← Back to Home</a>

    <div class="auth-logo">🎓</div>
    <h1>Welcome back</h1>
    <p class="auth-sub">Sign in to access your full career report</p>

    <!-- EMAIL FORM -->
    <form (ngSubmit)="submit()" class="auth-form">

      <div class="field">
        <label>Email Address</label>
        <input type="email" [(ngModel)]="form.email" name="email" placeholder="you@example.com" autocomplete="email" />
      </div>

      <div class="field">
        <label>Password</label>
        <div class="input-wrap">
          <input [type]="showPassword() ? 'text' : 'password'" [(ngModel)]="form.password" name="password" placeholder="Your password" autocomplete="current-password" />
          <button type="button" class="toggle-pw" (click)="showPassword.set(!showPassword())">{{ showPassword() ? '🙈' : '👁️' }}</button>
        </div>
      </div>

      @if (error()) {
        <div class="error-box">⚠️ {{ error() }}</div>
      }

      <button type="submit" class="submit-btn" [disabled]="loading()">
        @if (loading()) { <span class="btn-spinner"></span> }
        Sign In →
      </button>

    </form>

    <p class="login-link">Don't have an account? <a routerLink="/register" [queryParams]="{plan:'pro'}">Create one free</a></p>
  </div>
</div>
